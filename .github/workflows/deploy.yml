name: Build and Deploy to /docs folder on v4 branch

on:
  push:
    branches:
      - v4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # allows pushing back to repo

      - name: Setup Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Replace /docs with build output
        run: |
          rm -rf docs
          mv public docs

      - name: Commit and push changes to /docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update docs folder with latest build [skip ci]" || echo "No changes to commit"
          git push